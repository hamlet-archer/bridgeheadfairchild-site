<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridgehead Fairchild</title>
    <meta name="description" content="Bridgehead Fairchild Limited — Private office, Kent, England.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: linear-gradient(to bottom, #ece9e3, #e4e0d9);
            color: #af8939;
            font-family: 'EB Garamond', 'Georgia', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            max-width: 600px;
            text-align: center;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 2.5rem;
        }

        .description {
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.7;
            color: #af8939;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #c4b898;
            margin: 2rem 0;
        }

        .email-img {
            width: 240px;
            height: auto;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .email-img:hover {
            opacity: 1;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 2rem;
            font-size: 0.78rem;
            color: #b8a67a;
            line-height: 1.8;
        }

        footer span {
            display: block;
        }

        @media (max-width: 480px) {
            .logo {
                max-width: 150px;
            }

            .description {
                font-size: 0.95rem;
            }

            .email-img {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Bridgehead Fairchild" class="logo">

        <p class="description">
            A private office based in Kent, England.
        </p>

        <div class="divider"></div>

        <img src="email.svg" alt="" class="email-img" draggable="false">
    </div>

    <footer>
        <span>Bridgehead Fairchild Limited</span>
        <span>Registered in England &amp; Wales &middot; Company No. 15565672</span>
        <span>&copy; 2024&ndash;2026</span>
    </footer>
</body>
</html>
